<style>
  :root{
    /* 막마다 바뀌는 색 — 이제 세탁소 그림, 진행바, 도장에만 쓰임 */
    --bg-1:#eaf4f2; --panel-1:#ffffff; --ink-1:#1f2b28; --sub-1:#5c6f6a;
    --accent-1:#3fa79a; --accent-1b:#f2c14e; --stain-1:#8d7a5a;
    --bg-2:#ddd3c4; --panel-2:#efe6d6; --ink-2:#2a2320; --sub-2:#6b5d4c;
    --accent-2:#a8442f; --accent-2b:#7a6a4f; --stain-2:#7a1f1a;
    --bg-3:#0e0b0a; --panel-3:#1a1513; --ink-3:#cfc6bd; --sub-3:#847b73;
    --accent-3:#b8323c; --accent-3b:#4a4038; --stain-3:#5c1216;
    --bg:var(--bg-1); --panel:var(--panel-1); --ink:var(--ink-1); --sub:var(--sub-1);
    --accent:var(--accent-1); --accentb:var(--accent-1b); --stainc:var(--stain-1);

    /* 쯔꾸르식 창 — 막과 상관없이 그대로 */
    --win-fill:linear-gradient(rgba(46,46,48,.9), rgba(20,20,22,.93));   /* 진한 회색 */
    --win-line:#ececec;          /* 창 안쪽 흰 테두리 */
    --win-out:#000000;           /* 창 바깥 검은 테두리 */
    --txt:#ffffff;
    --txt-shadow:2px 2px 0 #000;
    --sys:#a8bcff;               /* 항목 이름 같은 시스템 글자 (쯔꾸르의 하늘색) */
    --hi:#ffe08a;                /* 강조 글자 */
    --page:#000000; --frame:#2b2b2b;
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}   /* 모바일 터치 시 파란 번쩍임 끄기 */
  html,body{height:100%;margin:0;background:var(--page);}
  body{
    font-family:'NeoDunggeunmo',monospace;
    font-size:16px; line-height:24px;          /* 둥근모는 16px 배수에서 도트가 또렷함 */
    color:var(--txt);
    display:flex; align-items:center; justify-content:center;
    min-height:100%;
    padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:none; font-smooth:never;
    word-break:keep-all; overflow-wrap:anywhere;   /* 한국어는 단어 단위로 줄바꿈 */
    overflow-x:hidden;
  }
  body[data-act="1"]{--bg:var(--bg-1);--panel:var(--panel-1);--ink:var(--ink-1);--sub:var(--sub-1);--accent:var(--accent-1);--accentb:var(--accent-1b);--stainc:var(--stain-1);}
  body[data-act="2"]{--bg:var(--bg-2);--panel:var(--panel-2);--ink:var(--ink-2);--sub:var(--sub-2);--accent:var(--accent-2);--accentb:var(--accent-2b);--stainc:var(--stain-2);}

      refuse:"이걸 들고 갈 데가 여기밖에 없었어요.\n저도 제가 이렇게 된 게 싫어요.",
      shape:"heart", stainColor:"blood", stains:70,
      memwords:["더러워진 건 나야","내가 뭘 잘못했는데","그때 왜 가만히 있었지","용서 못 해","용서받고 싶어"],
      cust:{coat:"#6a5a5c",coat2:"#554849",hair:"#241f1d",skin:"#c4aa94",eye:"#2a2320"} }
  ];

  var STAIN_COLORS = {
    stain:{1:"#8d7a5a",2:"#7a1f1a",3:"#5c1216"},
    blood:{1:"#a5332c",2:"#7a1f1a",3:"#7a1620"}
  };

  var SHOP = {
    1:{wall:"#cfe3df",line:"#aec9c4",mach:"#ffffff",machEdge:"#9fb8b4",glass:"#7ea8a3",
       floor:"#bdd2cd",counter:"#8fb3ad",counterTop:"#e4efed",lamp:"#f2c14e",light:"rgba(255,255,255,0.12)"},
    2:{wall:"#c6b9a4",line:"#a89a80",mach:"#e3d7c4",machEdge:"#a8977e",glass:"#8a7a63",
       floor:"#a8977e",counter:"#7a6a4f",counterTop:"#bfae92",lamp:"#d9a441",light:"rgba(255,230,180,0.10)"},
    3:{wall:"#171210",line:"#221b18",mach:"#241d1a",machEdge:"#120e0d",glass:"#0c0909",
       floor:"#100c0b",counter:"#2a211e",counterTop:"#3a2f2a",lamp:"#7a1620",light:"rgba(255,190,120,0.07)"}
  };

  /* =====================================================================
     [3] 씬 그리기
     ===================================================================== */

  var sceneEl   = document.getElementById('scene');
  var sctx      = sceneEl.getContext('2d');
  var layerEl   = document.getElementById('layer');
  var bodyEl    = document.body;
  sctx.imageSmoothingEnabled = false;

  var scene = { act:1, item:null, custX:0, custAlpha:1 };
  var state = { index:-1, act:1 };

  function setAct(act){
    state.act = act;
    bodyEl.setAttribute('data-act', act);
    scene.act = (act === 'end') ? 3 : act;
  }
  function showScene(on){ sceneEl.classList.toggle('on', on); }

  function drawScene(){
    sctx.clearRect(0,0,SCENE_W,SCENE_H);
    drawBg(scene.act);
    if(scene.item) drawCustomer(scene.item, scene.custX, scene.custAlpha);
    drawCounter(scene.act);
  }

  // ---- 배경 ----
  function drawBg(act){
    var img = getImg(ASSETS.bg[act]);
    if(img){ sctx.drawImage(img, 0, 0, SCENE_W, SCENE_H); return; }
    placeholderBg(act);
  }

  function placeholderBg(act){
    var p = SHOP[act] || SHOP[1];
    sctx.fillStyle = p.wall;  sctx.fillRect(0,0,SCENE_W,SCENE_H);
    sctx.fillStyle = p.floor; sctx.fillRect(0,154,SCENE_W,54);
    sctx.fillStyle = p.line;  sctx.fillRect(0,154,SCENE_W,1);
    // 세탁기 5대
    for(var m=0;m<5;m++){
      var x = 8 + m*52;
      sctx.fillStyle = p.machEdge; sctx.fillRect(x,76,46,76);
      sctx.fillStyle = p.mach;     sctx.fillRect(x+2,78,42,72);
      sctx.fillStyle = p.machEdge; sctx.fillRect(x+7,82,32,7);
      sctx.fillStyle = p.glass;    sctx.fillRect(x+10,98,26,26);
    }
    // 천장등 2개 + 빛
    [72,200].forEach(function(lx){
      sctx.fillStyle = p.lamp; sctx.fillRect(lx-9,26,18,5); sctx.fillRect(lx-1,0,2,26);
      sctx.fillStyle = p.light;
      sctx.beginPath();
      sctx.moveTo(lx-9,31); sctx.lineTo(lx+9,31);
      sctx.lineTo(lx+48,176); sctx.lineTo(lx-48,176);
      sctx.closePath(); sctx.fill();
    });
  }

  // ---- 카운터 ----
  function drawCounter(act){
    if(ASSETS.counter === "none") return;
    var img = getImg(ASSETS.counter);
    if(img){ sctx.drawImage(img, COUNTER_BOX.x, COUNTER_BOX.y, COUNTER_BOX.w, COUNTER_BOX.h); return; }
    var p = SHOP[act] || SHOP[1];
    sctx.fillStyle = p.counterTop; sctx.fillRect(0,176,SCENE_W,6);
    sctx.fillStyle = p.counter;    sctx.fillRect(0,182,SCENE_W,26);
  }

  // ---- 손님 ----
  function drawCustomer(item, offsetX, alpha){
    sctx.globalAlpha = alpha;
    var b = CUST_BOX;
    var qx = Math.round(offsetX / 4) * 4;                                  // 4도트 칸에 맞춰 끊어 그림
    var by = (scene.walking && (Math.round(offsetX / 4) % 2)) ? -2 : 0;    // 걸을 때 한 칸 걸러 들썩
    var img = getImg(ASSETS.customers[item.id]);
    if(img) sctx.drawImage(img, b.x + qx, b.y + by, b.w, b.h);
    else    placeholderCustomer(item.cust, b.x + qx + b.w/2, b.y + by);
    sctx.globalAlpha = 1;
  }

  function placeholderCustomer(c, cx, top){
    c = c || {};
    sctx.fillStyle = c.coat2 || "#444"; sctx.fillRect(cx-17,top+42,6,60);
    sctx.fillStyle = c.coat2 || "#444"; sctx.fillRect(cx+11,top+42,6,60);
    sctx.fillStyle = c.coat  || "#555"; sctx.fillRect(cx-12,top+40,24,72);
    sctx.fillStyle = c.skin  || "#ddb"; sctx.fillRect(cx-3,top+34,6,8);
    sctx.fillStyle = c.skin  || "#ddb"; sctx.fillRect(cx-9,top+16,18,20);
    sctx.fillStyle = c.hair  || "#222";
    sctx.fillRect(cx-10,top+13,20,8);
    sctx.fillRect(cx-10,top+13,4,16);
    sctx.fillRect(cx+6,top+13,4,14);
    sctx.fillStyle = c.eye || "#2a2320";
    sctx.fillRect(cx-6,top+25,3,3);
    sctx.fillRect(cx+3,top+25,3,3);
    if(c.hat){ sctx.fillStyle = c.hat; sctx.fillRect(cx-13,top+9,26,5); sctx.fillRect(cx-9,top+2,18,8); }
  }

  // 손님 걸음 — 쯔꾸르 캐릭터처럼 일정한 속도로 걷고, 그리기는 4도트 칸 단위로 끊김
  function tween(dur, step, done){
    var t0 = performance.now();
    scene.walking = true;
    (function loop(now){
      var k = Math.min(1,(now - t0)/dur);
      step(k);
      drawScene();
      if(k < 1) requestAnimationFrame(loop);
      else { scene.walking = false; drawScene(); if(done) done(); }
    })(t0);
  }

  /* =====================================================================
     [4] 흐름
     ===================================================================== */

  var renderToken = 0;
  function render(html){ renderToken++; layerEl.innerHTML = html; return renderToken; }
  function stale(tok){ return tok !== renderToken; }

  function typewrite(el, text, done){
    var i = 0, alive = true;
    el.textContent = "";
    var t = setInterval(tick, 34);
    function tick(){
      el.textContent += text.charAt(i); i++;
      if(i >= text.length){ clearInterval(t); alive = false; if(done) done(); }
    }
    return function skip(){
      if(!alive) return false;
      clearInterval(t); alive = false;
      el.textContent = text;
      if(done) done();
      return true;
    };
  }

  function showTitle(){
    setAct(1); showScene(false);
    render(
      '<div class="fullscreen fade">'+
        '<div class="logo">무엇이든 세탁해드립니다</div>'+
        '<div class="center-note">손님이 맡긴 것을 세탁해 주세요.<br>얼룩을 문질러서 지우면 다음 손님으로 넘어갑니다.</div>'+
        '<div class="actions"><button id="startBtn">출근한다</button></div>'+
      '</div>'
    );
    document.getElementById('startBtn').onclick = showPrologue;
  }

  // ---------- 프롤로그 ----------
  function showPrologue(){
    setAct(1); showScene(false);
    var idx = 0, skip = null, leaving = false;
    bodyEl.classList.add('dark-chrome');

    var tok = render(
      '<div class="prologue fade" id="pro">'+
        '<div class="who">— 어제, 면접에서</div>'+
        '<div class="line" id="proLine"></div>'+
        '<div class="tap">▼</div>'+
      '</div>'
    );
    var proEl  = document.getElementById('pro');
    var lineEl = document.getElementById('proLine');
    lineEl.style.whiteSpace = "pre-line";

    function play(){
      proEl.classList.remove('done');
      skip = typewrite(lineEl, PROLOGUE[idx], function(){ proEl.classList.add('done'); });
    }
    proEl.onclick = function(){
      if(leaving) return;
      if(skip && skip()) return;
      idx++;
      if(idx >= PROLOGUE.length){ leaving = true; fadeIntoShop(tok); return; }
      play();
    };
    play();
  }

  function fadeIntoShop(tok){
    var pro = document.getElementById('pro');
    if(pro){ pro.style.transition = "opacity 1.1s steps(4,end)"; pro.style.opacity = "0"; }
    setTimeout(function(){
      if(stale(tok)) return;
      bodyEl.classList.remove('dark-chrome');
      render(''); drawScene(); showScene(true);
      setTimeout(nextItem, 900);
    }, 1150);
  }

  // ---------- 막 전환 ----------
  function actTransitionText(fromAct, toAct){
    if(fromAct===1 && toAct===2) return "일이 손에 익었다.\n\n그리고 손님들은 점점 이상한 것을 맡기기 시작했다.";
    if(fromAct===2 && toAct===3) return "언제부턴가 거절하는 법을 잊었다.\n\n그리고 어느 날부터,\n손님들은 더 이상 '옷'을 가져오지 않았다.";
    return "";
  }

  function nextItem(){
    var prevAct = state.index >= 0 ? ITEMS[state.index].act : 1;
    state.index++;
    if(state.index >= ITEMS.length){ showEnding(); return; }

    var item = ITEMS[state.index];
    if(item.act !== prevAct){
      showScene(false); setAct(item.act); scene.item = null;
      var tok = render(
        '<div class="fullscreen dark fade">'+
          '<div class="center-note" style="white-space:pre-line;">'+actTransitionText(prevAct,item.act)+'</div>'+
          '<div class="actions"><button id="contBtn">가게 문을 연다</button></div>'+
        '</div>'
      );
      document.getElementById('contBtn').onclick = function(){
        render(''); drawScene(); showScene(true);
        setTimeout(function(){ if(!stale(tok+1)) showCustomer(item); }, 700);
      };
      return;
    }
    showCustomer(item);
  }

  // ---------- 손님 등장 ----------
  function showCustomer(item){
    setAct(item.act); showScene(true);

    var canRefuse = item.act >= 2 && item.refuse;

    var tok = render(
      '<div class="slip" id="slip">'+
        '<div class="head">접   수   증</div>'+
        '<div class="row"><span>품목</span><b>'+item.name+'</b></div>'+
        '<div class="row"><span>요청</span><b>'+item.request+'</b></div>'+
        '<div class="row"><span>비고</span><b>'+item.note+'</b></div>'+
      '</div>'+
      '<div class="bubble" id="bub" style="opacity:0;">'+
        '<span class="who">손님</span><span class="txt" id="bubTxt"></span>'+
      '</div>'+
      '<div class="actions" id="acts" style="opacity:0;pointer-events:none;">'+
        '<button id="acceptBtn">세탁 시작</button>'+
        (canRefuse ? '<button id="refuseBtn" class="refuse-btn">거절하기</button>' : '')+
      '</div>'
    );

    scene.item = item; scene.custAlpha = 1;
    tween(900, function(k){ scene.custX = -90 + 90*k; }, function(){
      if(stale(tok)) return;
      var bub = document.getElementById('bub');
      bub.style.transition = "opacity .4s ease";
      bub.style.opacity = "1";
      typewrite(document.getElementById('bubTxt'), item.open, function(){
        if(stale(tok)) return;
        bub.classList.add('done');
        setTimeout(function(){
          if(stale(tok)) return;
          document.getElementById('slip').classList.add('in');
          var acts = document.getElementById('acts');
          acts.style.transition = "opacity .5s ease";
          acts.style.opacity = "1";
          acts.style.pointerEvents = "auto";
        }, 350);
      });
    });

    document.getElementById('acceptBtn').onclick = function(){ showWashing(item); };
    if(canRefuse) document.getElementById('refuseBtn').onclick = function(){ showRefusal(item); };
  }

  // ---------- 거절 ----------
  function showRefusal(item){
    var box = document.createElement('div');
    box.className = 'refuse';
    box.innerHTML = '<b style="white-space:pre-line;">'+item.refuse+'</b><span class="tap">▼</span>';
    layerEl.appendChild(box);

    box.onclick = function(){
      box.remove();
      var btn = document.getElementById('refuseBtn');
      if(btn){ btn.disabled = true; btn.textContent = "…거절할 수 없다"; }
    };
  }

  // ---------- 세탁 (공통) ----------
  // 손님 세탁물과 엔딩의 '내가 맡긴 것' 이 같은 손놀림을 쓰도록 하나로 묶었습니다.
  //   W,H        캔버스 논리 해상도 (도트 좌표계)
  //   cssW,cssH  화면에 보이는 크기 (544x416 스테이지 기준 px)
  //   drawBase   세탁물 바탕을 그리는 함수
  //   stains     [{x,y}]  얼룩 점 목록
  //   finishAt   남은 얼룩이 이 개수 이하가 되면 나머지를 지우고 완료 처리
  function runWash(o){
    var W = o.W, H = o.H, dot = o.dot || 2, radius = o.radius || 7;
    render(
      (o.slipHtml || '')+
      '<div class="washbox fade'+(o.wide ? ' wide' : '')+'">'+
        '<div class="stage-item" id="stageWrap">'+
          '<canvas id="itemCanvas" width="'+W+'" height="'+H+'" style="width:'+o.cssW+'px;height:'+o.cssH+'px;"></canvas>'+
          '<div class="stamp" id="stamp">'+o.stamp+'</div>'+
        '</div>'+
        '<div class="prog"><i id="progBar"></i></div>'+
        '<div class="actions"><button id="handBtn" disabled>문질러서 얼룩을 지우세요</button></div>'+
      '</div>'
    );

    var canvas = document.getElementById('itemCanvas');
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    var stains = o.stains, total = stains.length, washed = false;
    var finishAt = o.finishAt || 0;

    function draw(){
      ctx.clearRect(0,0,W,H);
      o.drawBase(ctx);
      ctx.fillStyle = o.stainColor;
      for(var i=0;i<stains.length;i++) ctx.fillRect(stains[i].x, stains[i].y, dot, dot);
    }
    draw();
    var redraw = setInterval(function(){                 // 에셋이 늦게 로드돼도 다시 그림
      if(!document.getElementById('itemCanvas')){ clearInterval(redraw); return; }
      draw();
    }, 400);

    function updateProgress(){
      if(!washed && stains.length <= finishAt){ stains.length = 0; draw(); }
      var pct = total === 0 ? 1 : (1 - stains.length/total);
      document.getElementById('progBar').style.width = Math.round(pct*100)+"%";
      if(pct >= 1 && !washed){
        washed = true;
        document.getElementById('stamp').classList.add('show');
        var h = document.getElementById('handBtn');
        h.disabled = false; h.textContent = o.doneLabel;
      }
    }

    var lastWord = 0;
    function maybeSpawnMemWord(x,y){
      if(!o.memwords) return;
      var now = performance.now();
      if(now - lastWord < 550) return;
      lastWord = now;
      var span = document.createElement('span');
      span.className = 'memword';
      span.textContent = o.memwords[Math.floor(Math.random()*o.memwords.length)];
      var wrap = document.getElementById('stageWrap');
      var rect = canvas.getBoundingClientRect(), wrapRect = wrap.getBoundingClientRect();
      // 화면 좌표 → 스테이지 내부 좌표 (배율만큼 나눠줌)
      span.style.left = (((x/W)*rect.width  + (rect.left-wrapRect.left)) / SCALE) + 'px';
      span.style.top  = (((y/H)*rect.height + (rect.top -wrapRect.top )) / SCALE) + 'px';
      wrap.appendChild(span);
      requestAnimationFrame(function(){ span.classList.add('show'); });
      setTimeout(function(){
        span.classList.remove('show');
        setTimeout(function(){ span.remove(); }, 900);
      }, 500);
    }

    function scrubAt(clientX, clientY){
      var rect = canvas.getBoundingClientRect();
      var x = (clientX - rect.left)/rect.width*W;
      var y = (clientY - rect.top)/rect.height*H;
      var changed = false, r2 = radius*radius;
      for(var i=stains.length-1;i>=0;i--){
        var dx = stains[i].x - x, dy = stains[i].y - y;
        if(dx*dx + dy*dy < r2){ stains.splice(i,1); changed = true; }
      }
      if(changed){ draw(); updateProgress(); maybeSpawnMemWord(x,y); }
    }

    var dragging = false;
    canvas.addEventListener('pointerdown', function(e){ dragging = true; scrubAt(e.clientX,e.clientY); });
    window.addEventListener('pointerup', function(){ dragging = false; });
    canvas.addEventListener('pointermove', function(e){ if(dragging) scrubAt(e.clientX,e.clientY); });

    document.getElementById('handBtn').onclick = function(){ clearInterval(redraw); o.onDone(); };
  }

  // ---------- 손님의 세탁물 ----------
  function showWashing(item){
    runWash({
      W:64, H:64, cssW:196, cssH:196, dot:2, radius:7,
      slipHtml:
        '<div class="slip pinned">'+
          '<div class="head">접   수   증</div>'+
          '<div class="row"><span>품목</span><b>'+item.name+'</b></div>'+
          '<div class="row"><span>요청</span><b>'+item.request+'</b></div>'+
          '<div class="row"><span>비고</span><b>'+item.note+'</b></div>'+
        '</div>',
      drawBase: function(ctx){
        var img = getImg(ASSETS.items[item.id]);
        if(img) ctx.drawImage(img,0,0,64,64); else drawShape(ctx, item.shape);
      },
      stains: makeStains(item),
      stainColor: STAIN_COLORS[item.stainColor][item.act] || STAIN_COLORS[item.stainColor][1],
      memwords: item.memwords,
      stamp: item.act >= 3 ? '지움' : '완료',        // 같은 동작, 3막부터는 다른 이름
      doneLabel: '손님에게 건네기',
      onDone: function(){ showResult(item); }
    });
  }

  function makeStains(item){
    var arr = [], bbox = SHAPE_BBOX[item.shape] || {x:12,y:12,w:40,h:40};
    for(var i=0;i<item.stains;i++)
      arr.push({ x: bbox.x + Math.random()*bbox.w, y: bbox.y + Math.random()*bbox.h });
    return arr;
  }

  // ---------- 결과 ----------
  function showResult(item){
    render(
      '<div class="bubble done fade">'+
        '<span class="who">손님</span><span class="txt">'+item.close+'</span>'+
      '</div>'+
      '<div class="actions"><button id="nextBtn">배웅한다</button></div>'
    );
    document.getElementById('nextBtn').onclick = function(){
      var tok = render('');
      var from = scene.custX;
      tween(800, function(k){
        scene.custX = from + 130*k;
        scene.custAlpha = 1 - k;
      }, function(){
        scene.item = null; scene.custAlpha = 1; scene.custX = 0;
        drawScene();
        setTimeout(function(){ if(!stale(tok)) nextItem(); }, 450);
      });
    };
  }

  // ---------- 엔딩 ----------
  // 관객이 적은 내용은 이 화면 안에서만 쓰이고, 어디에도 저장하거나 보내지 않습니다.
  var SELF = { request:"아무 일 없었던 것처럼", note:"묻지 않음" };

  function esc(t){
    return String(t).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function doneList(mine){
    var h = ITEMS.map(function(it){ return '<div>· '+it.name+' — '+it.request+'</div>'; }).join('');
    if(mine) h += '<div class="mine">· '+esc(mine)+' — '+SELF.request+'</div>';
    return h;
  }

  function showEnding(){
    setAct('end'); showScene(false); scene.item = null;
    render(
      '<div class="fullscreen dark fade">'+
        '<div class="center-note">오늘 지운 것들</div>'+
        '<div class="list">'+doneList()+'</div>'+
        '<div class="center-note" >당신도 혹시 맡길 것이 있나요?</div>'+
        '<div class="actions">'+
          '<button id="yesBtn">맡길 것이 있다</button>'+
          '<button id="noBtn" class="ghost">없다</button>'+
        '</div>'+
      '</div>'
    );
    document.getElementById('yesBtn').onclick = showOwnSlip;
    document.getElementById('noBtn').onclick  = function(){
      endCard("손을 씻었다.<br>오늘 만진 것들이 손끝에 남아 있다.");
    };
  }

  // 빈 접수증이 내려온다. 품목 칸만 비어 있다.
  function showOwnSlip(){
    setAct(3); scene.item = null; drawScene(); showScene(true);
    var tok = render(
      '<div class="slip own" id="slip">'+
        '<div class="head">접   수   증</div>'+
        '<div class="row"><span>품목</span><input id="ownInput" maxlength="30" autocomplete="off" spellcheck="false" aria-label="맡길 것"></div>'+
        '<div class="row"><span>요청</span><b>'+SELF.request+'</b></div>'+
        '<div class="row"><span>비고</span><b>'+SELF.note+'</b></div>'+
      '</div>'+
      '<div class="ownhint" id="ownHint" style="opacity:0;">적은 것은 이 화면 밖으로 나가지 않습니다.</div>'+
      '<div class="actions center" id="acts" style="opacity:0;pointer-events:none;">'+
        '<button id="giveBtn" disabled>맡긴다</button>'+
      '</div>'
    );
    var input = document.getElementById('ownInput');
    var give  = document.getElementById('giveBtn');

    setTimeout(function(){
      if(stale(tok)) return;
      document.getElementById('slip').classList.add('in');
      setTimeout(function(){
        if(stale(tok)) return;
        ['acts','ownHint'].forEach(function(id){
          var el = document.getElementById(id);
          el.style.transition = "opacity .6s ease"; el.style.opacity = "1"; el.style.pointerEvents = "auto";
        });
        input.focus();
      }, 700);
    }, 500);

    input.addEventListener('input', function(){ give.disabled = !input.value.trim(); });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !e.isComposing && !give.disabled) give.click();
    });
    give.onclick = function(){ showOwnWash(input.value.trim()); };
  }

  // 적은 글자를 나누어 최대 3줄로
  function wrapLines(text, per){
    var words = text.split(/\s+/), lines = [], cur = "";
    words.forEach(function(w){
      while(w.length > per){                         // 띄어쓰기 없는 긴 말은 강제로 자름
        if(cur){ lines.push(cur); cur = ""; }
        lines.push(w.slice(0,per)); w = w.slice(per);
      }
      if(!w) return;
      if(!cur) cur = w;
      else if((cur + " " + w).length <= per) cur += " " + w;
      else { lines.push(cur); cur = w; }
    });
    if(cur) lines.push(cur);
    if(lines.length > 3){ lines = lines.slice(0,3); lines[2] = lines[2].slice(0,per-1) + "…"; }
    return lines;
  }

  // 내가 적은 글자가 얼룩이 되어 천 위에 찍힌다. 그걸 내 손으로 지운다.
  function showOwnWash(text){
    var W = 176, H = 64;
    var ink = document.createElement('canvas');      // 글자 모양을 먼저 그려서
    ink.width = W; ink.height = H;
    var ic = ink.getContext('2d');

    function build(){
      var lines = wrapLines(text, 10), lh = 19;
      ic.clearRect(0,0,W,H);
      ic.fillStyle = "#000";
      ic.font = "16px NeoDunggeunmo, monospace";
      ic.textAlign = "center"; ic.textBaseline = "middle";
      var y0 = H/2 - (lines.length-1)*lh/2;
      lines.forEach(function(l,i){ ic.fillText(l, W/2, Math.round(y0 + i*lh)); });

      var px = ic.getImageData(0,0,W,H).data, stains = [];   // 글자 픽셀 하나하나가 얼룩 점
      for(var y=0;y<H;y++) for(var x=0;x<W;x++){
        if(px[(y*W+x)*4+3] > 110) stains.push({x:x, y:y});
      }

      runWash({
        W:W, H:H, cssW:352, cssH:128, dot:1, radius:5, wide:true,
        drawBase: function(ctx){
          ctx.fillStyle = "#2a2320"; ctx.fillRect(2,2,W-4,H-4);      // 천
          ctx.fillStyle = "#f4efe4"; ctx.fillRect(3,3,W-6,H-6);
          ctx.fillStyle = "#ddd3c2";
          for(var sx=8; sx<W-8; sx+=4){ ctx.fillRect(sx,6,2,1); ctx.fillRect(sx,H-7,2,1); }   // 박음질
          for(var sy=8; sy<H-8; sy+=4){ ctx.fillRect(6,sy,1,2); ctx.fillRect(W-7,sy,1,2); }
          ctx.globalAlpha = 0.07; ctx.drawImage(ink,0,0); ctx.globalAlpha = 1;   // 다 지워도 남는 자국
        },
        stains: stains,
        stainColor: "#6b1a1f",
        memwords: null,
        stamp: '지움',
        doneLabel: '돌려받는다',
        finishAt: Math.ceil(stains.length * 0.03),     // 글자 픽셀이 많아서 마지막 몇 점은 봐줌
        onDone: function(){ showFinal(text); }
      });
    }

    if(document.fonts && document.fonts.load){
      document.fonts.load("16px NeoDunggeunmo").then(build, build);
    } else build();
  }

  function showFinal(mine){
    setAct('end'); showScene(false);
    render(
      '<div class="fullscreen dark fade">'+
        '<div class="center-note">오늘 지운 것들</div>'+
        '<div class="list" id="finalList">'+doneList(mine)+'</div>'+
        '<div class="center-note">고맙습니다. 이제 아무 일도 없었던 거예요.</div>'+
        '<div class="actions"><button id="restartBtn">처음으로</button></div>'+
      '</div>'
    );
    var list = document.getElementById('finalList');
    list.scrollTop = list.scrollHeight;               // 맨 아래, 내가 맡긴 줄이 보이게
    document.getElementById('restartBtn').onclick = restart;
  }

  function endCard(text){
    render(
      '<div class="fullscreen dark fade">'+
        '<div class="center-note" >'+text+'</div>'+
        '<div class="actions"><button id="restartBtn">처음으로</button></div>'+
      '</div>'
    );
    document.getElementById('restartBtn').onclick = restart;
  }

  function restart(){
    state = { index:-1, act:1 };
    scene.item = null; scene.custX = 0; scene.custAlpha = 1;
    showTitle();
  }

  /* =====================================================================
     [5] 세탁물 placeholder 도형 (64x64) — ASSETS.items 채우면 안 쓰임
     ===================================================================== */
  var SHAPE_BBOX = {
    shirt:{x:14,y:14,w:36,h:36}, bear:{x:12,y:12,w:40,h:40},
    shoe:{x:8,y:24,w:48,h:22},   cash:{x:12,y:20,w:40,h:26},
    card:{x:10,y:20,w:44,h:24},  brain:{x:10,y:12,w:44,h:36},
    eye:{x:8,y:22,w:48,h:22},    heart:{x:12,y:12,w:40,h:40}
  };

  function px(ctx,x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }

  function drawShape(ctx, shape){
    var base = "#f4efe4";
    if(shape==="shirt"){
      px(ctx,18,14,28,8,base); px(ctx,14,18,8,10,base); px(ctx,42,18,8,10,base);
      px(ctx,18,20,28,28,base); px(ctx,26,14,12,4,"#dcd3c4");
    } else if(shape==="bear"){
      px(ctx,16,14,8,8,"#c99a63"); px(ctx,40,14,8,8,"#c99a63");
      px(ctx,18,20,28,24,"#c99a63"); px(ctx,24,44,7,8,"#c99a63"); px(ctx,33,44,7,8,"#c99a63");
      px(ctx,26,28,4,4,"#5a3f28"); px(ctx,34,28,4,4,"#5a3f28"); px(ctx,29,34,6,4,"#5a3f28");
    } else if(shape==="shoe"){
      px(ctx,10,26,38,10,"#e7e0d0"); px(ctx,10,36,44,8,"#3a352e"); px(ctx,42,20,8,14,"#e7e0d0");
      px(ctx,14,30,4,2,"#3a352e"); px(ctx,22,30,4,2,"#3a352e"); px(ctx,30,30,4,2,"#3a352e");
    } else if(shape==="cash"){
      for(var i=0;i<4;i++) px(ctx,14+i*2,22-i*2,36,20,"#cfead0");
      px(ctx,22,20,20,16,"#9fd6a3");
    } else if(shape==="card"){
      px(ctx,10,20,44,24,"#e9e4d6"); px(ctx,14,24,12,14,"#b9c7c5");
      px(ctx,29,25,20,3,"#8d8577"); px(ctx,29,31,20,3,"#8d8577"); px(ctx,29,37,14,3,"#8d8577");
      px(ctx,14,40,40,2,"#2a2320");
    } else if(shape==="brain"){
      px(ctx,14,16,36,26,"#dba7ad"); px(ctx,10,22,6,14,"#dba7ad"); px(ctx,48,22,6,14,"#dba7ad");
      px(ctx,20,20,3,18,"#b06d76"); px(ctx,28,18,3,22,"#b06d76"); px(ctx,36,20,3,18,"#b06d76");
    } else if(shape==="eye"){
      px(ctx,10,26,44,14,"#f2ede0"); px(ctx,16,22,32,4,"#f2ede0"); px(ctx,16,40,32,4,"#f2ede0");
      px(ctx,26,27,14,14,"#3c6e8f"); px(ctx,30,31,6,6,"#14181c");
    } else if(shape==="heart"){
      px(ctx,14,16,16,10,"#b5474c"); px(ctx,34,16,16,10,"#b5474c");
      px(ctx,14,24,36,10,"#b5474c"); px(ctx,18,34,28,6,"#b5474c"); px(ctx,24,40,16,6,"#b5474c");
    }
  }

  document.addEventListener('keydown', function(e){
    if(e.target && e.target.tagName === 'INPUT') return;          // 엔딩 입력칸은 그대로
    var choices = Array.prototype.filter.call(
      layerEl.querySelectorAll('.actions button'),
      function(b){
        var box = b.closest('.actions');
        return !b.disabled && box && getComputedStyle(box).pointerEvents !== 'none' && getComputedStyle(box).opacity !== '0';
      });
    var k = e.key;
    if(k === 'ArrowDown' || k === 'ArrowUp'){
      if(!choices.length) return;
      e.preventDefault();
      var i = choices.indexOf(document.activeElement);
      i = i < 0 ? (k === 'ArrowDown' ? (choices.length > 1 ? 1 : 0) : 0)
                : (i + (k === 'ArrowDown' ? 1 : -1) + choices.length) % choices.length;
      choices[i].focus();
    } else if(k === 'Enter' || k === ' ' || k === 'z' || k === 'Z'){
      if(document.activeElement && document.activeElement.tagName === 'BUTTON') return;   // 버튼 자체가 처리
      var tap = layerEl.querySelector('.refuse') || document.getElementById('pro');
      e.preventDefault();
      if(tap){ tap.click(); return; }
      if(choices.length) choices[0].click();                      // 첫 줄이 기본 선택
    }
  });

  drawScene();
  showTitle();
})();
</script>
